name: Build Desktop Installers

on:
  release:
    types: [published]           # triggers when a GitHub Release is published
  workflow_dispatch:             # manual trigger from the Actions tab

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false           # a macOS failure must not cancel Windows
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout: main repo + 5 sibling dependencies ──────────────────
      # The layout mirrors local dev:
      #   $GITHUB_WORKSPACE/
      #   ├── mortgage-work/     ← pyproject.toml lives here
      #   ├── zig/               ← referenced as ../zig
      #   ├── chak-ai/           ← referenced as ../chak-ai
      #   ├── fyle/              ← referenced as ../fyle
      #   ├── seeka-ai/          ← referenced as ../seeka-ai
      #   └── rill-ai/           ← referenced as ../rill-ai

      - name: Checkout mortgage-work
        uses: actions/checkout@v4
        with:
          path: mortgage-work

      - name: Checkout zig
        uses: actions/checkout@v4
        with:
          repository: zhixiangxue/zig
          path: zig

      - name: Checkout chak-ai
        uses: actions/checkout@v4
        with:
          repository: zhixiangxue/chak-ai
          path: chak-ai

      - name: Checkout fyle
        uses: actions/checkout@v4
        with:
          repository: zhixiangxue/fyle
          path: fyle

      - name: Checkout seeka-ai
        uses: actions/checkout@v4
        with:
          repository: zhixiangxue/seeka-ai
          path: seeka-ai

      - name: Checkout rill-ai
        uses: actions/checkout@v4
        with:
          repository: zhixiangxue/rill-ai
          path: rill-ai

      # ── Toolchain ─────────────────────────────────────────────────────

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # ── Build frontend ────────────────────────────────────────────────

      - name: Build frontend (npm)
        working-directory: mortgage-work/frontend
        run: |
          npm ci
          npm run build

      # ── Install Python dependencies ───────────────────────────────────
      # --all-groups picks up the "macos" group (pyobjc) on Darwin; on
      # Windows the sys_platform markers skip those packages naturally.

      - name: Install Python dependencies
        working-directory: mortgage-work
        run: uv sync --all-groups --no-editable

      # PyInstaller is a build-only tool — not a runtime dependency.
      - name: Install PyInstaller
        working-directory: mortgage-work
        run: uv pip install pyinstaller

      # ── Optional: inject .env from GitHub Secret ─────────────────────
      # MW_ENV holds the NON-SECRET runtime config only — at minimum
      # AUTH_SERVICE_URL=https://... (AGENT_PORT optional). The build's
      # spec whitelists exactly those keys into the bundled .env anyway.
      # Infrastructure credentials (RAG/KG, web fetching) never belong
      # here: they are delivered with the login session by server/.
      # Without MW_ENV the app falls back to localhost defaults.

      - name: Create .env (optional)
        working-directory: mortgage-work
        run: |
          if [ -n "$MW_ENV" ]; then
            echo "$MW_ENV" > .env
            echo ".env created from MW_ENV secret"
          else
            echo "No MW_ENV secret — skipping .env"
          fi
        shell: bash
        env:
          MW_ENV: ${{ secrets.MW_ENV }}

      # ── Package ───────────────────────────────────────────────────────

      # Bundle MinGit so Windows users need no system git installed.
      # Download + trim happen at build time only (mirrors build.ps1).
      - name: Bootstrap bundled MinGit (Windows)
        if: runner.os == 'Windows'
        working-directory: mortgage-work
        shell: pwsh
        run: |
          $v = "2.47.1"
          $zip = "MinGit-$v-64-bit.zip"
          $dest = "vendor\mingit"
          if (-not (Test-Path "$dest\cmd\git.exe")) {
            Invoke-WebRequest "https://github.com/git-for-windows/git/releases/download/v$v.windows.1/$zip" -OutFile $zip -UseBasicParsing
            Expand-Archive $zip -DestinationPath $dest -Force
            Remove-Item $zip
          }
          # Trim: app only needs non-interactive https clone/fetch/pull/push.
          foreach ($p in @('usr','doc','mingw64\share','mingw64\etc\git-for-windows',
                           'mingw64\lib\git-credential-manager','mingw64\bin\scalar.exe')) {
            if (Test-Path (Join-Path $dest $p)) { Remove-Item -Recurse -Force (Join-Path $dest $p) }
          }
          Get-ChildItem "$dest\mingw64\bin" -File |
            Where-Object { $_.Name -match '^(Avalonia|MicroCom|SkiaSharp|HarfBuzzSharp|System\.|Microsoft\.|gcmcore|Atlassian\.|GitHub\.|GitLab\.)' } |
            Remove-Item -Force
          # Sanitize etc/gitconfig: stock MinGit ships credential.helper=manager
          # (GCM deleted above — it crashes auth'd requests with rc 128) and
          # [include]s of host system config that may re-inject GCM.
          Set-Content -Path "$dest\etc\gitconfig" -Encoding ASCII -Value @"
          [core]
              symlinks = false
              autocrlf = true
          [color]
              interactive = true
              ui = auto
          [pack]
              packSizeLimit = 2g
          [help]
              format = html
          [diff "astextplain"]
              textconv = astextplain
          [rebase]
              autosquash = true
          "@
          & "$dest\cmd\git.exe" --version

      - name: Run PyInstaller
        working-directory: mortgage-work
        run: uv run pyinstaller --clean --log-level DEBUG mortgage-work.spec

      # ── Diagnostic: list dist contents ───────────────────────────────

      - name: List dist directory (Windows)
        if: runner.os == 'Windows'
        working-directory: mortgage-work/dist/MortgageWork
        run: |
          echo === Directory tree ===
          cmd /c "dir /s /b"
          echo === DLL/PYD files ===
          cmd /c "dir /s /b *.dll *.pyd 2>nul"
        continue-on-error: true

      - name: List dist directory (macOS)
        if: runner.os == 'macOS'
        working-directory: mortgage-work/dist/Mortgage Work.app
        run: |
          echo "=== Directory tree ==="
          find . -type f | head -200
        continue-on-error: true

      # ── Test run on CI (captures the actual error) ───────────────────

      - name: Test run (CI diagnostic - Windows)
        if: runner.os == 'Windows'
        working-directory: mortgage-work/dist/MortgageWork
        run: ./"Mortgage Work.exe"
        continue-on-error: true
        timeout-minutes: 1

      - name: Test run (CI diagnostic - macOS)
        if: runner.os == 'macOS'
        working-directory: mortgage-work/dist/Mortgage Work.app/Contents/MacOS
        run: ./"Mortgage Work"
        continue-on-error: true
        timeout-minutes: 1

      # ── Upload ────────────────────────────────────────────────────────
      # upload-artifact zips automatically — no need for a manual zip step.
      # Download → extract once → ready to run.

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Mortgage-Work-Windows-X64
          path: mortgage-work/dist/MortgageWork/
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Mortgage-Work-macOS-ARM64
          path: mortgage-work/dist/Mortgage-Work-macOS-ARM64.dmg
          if-no-files-found: error

      # ── Attach to GitHub Release ────────────────────────────────────

      - name: Zip Windows artifact
        if: runner.os == 'Windows'
        working-directory: mortgage-work/dist
        run: |
          Compress-Archive -Path 'MortgageWork/*' -DestinationPath Mortgage-Work-Windows-X64.zip
        shell: pwsh

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        working-directory: mortgage-work
        run: |
          # Drag-to-Applications installer image; hdiutil ships with the
          # macOS runner. Unsigned — first launch needs right-click → Open.
          staging="build/dmg-staging"
          mkdir -p "$staging"
          cp -R "dist/Mortgage Work.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Mortgage Work" -srcdir "$staging" \
            -ov -format UDZO "dist/Mortgage-Work-macOS-ARM64.dmg"

      - name: Upload Windows to Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: mortgage-work/dist/Mortgage-Work-Windows-X64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS to Release
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: mortgage-work/dist/Mortgage-Work-macOS-ARM64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
