[project]
name = "mortgage-work"
version = "0.1.0"
description = "Mortgage Work — loan-officer desktop workbench (pywebview + Vue)"
requires-python = ">=3.12"
dependencies = [
    # Native desktop shell
    "pywebview>=5.0",
    # Data-browser viewer servers (falkordb / rqlite) served into the app via iframe
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # WebSocket protocol backend for uvicorn — the chat agent service (agent_service.py)
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.10",
    # Centralized config loading
    "python-dotenv>=1.0.0",
    # Local packages (also publishable to PyPI; pinned to local paths below for
    # debugging convenience via [tool.uv.sources])
    "zig", # FalkorDB graph client used by browser/falkordb.py
    "chakpy", # LLM conversation lib used by browser/rqlite.py (NL -> SQL)
    "fylepy[audio]", # any-file -> LLM-ready Markdown, wrapped by tools/reader.py
    # [audio]: faster-whisper so a voicemail / recorded call transcribes locally
    "seeka[lancedb]", # Embedded memory — note/dream/recall, used by agents/mem.py
    # Embeds search text for browser/qdrant_viewer.py semantic search (same
    # model that produced the stored vectors: OpenAI text-embedding-3-small)
    "openai>=1.0",
    # Async Redis client for browser/redis_viewer.py (keyspace + task-queue
    # inspector). Already present transitively via falkordb-py; pinned direct.
    "redis>=5",
    # pypdfium2 5.x ships only macosx_13_0 wheels (Ventura+); pin to 4.x on
    # macOS so the app still boots on older Intel Macs (Monterey 12.x).
    # Zero effect on Windows — the marker evaluates to False there.
    "pypdfium2<5; sys_platform == 'darwin'",
    "xxhash>=3.8.1",
    "pyyaml>=6.0.3",
    # Watches the work-repo checkout so the file tree follows disk (Explorer
    # copies, agent writes, git pull) instead of being patched by the UI
    "watchdog>=4.0",
    # clerk's heartbeat log in the agent-service terminal (agents/clerk.py)
    "rich>=15.0.0",
    # Token counting for ContractContextHandler (agents/context/)
    "tiktoken>=0.7",
    # PDF form filling (Pdf tool's fill/schema workflow — form-1003 sub-agent)
    "pypdfform>=1.0",
    # IM Gateway for connector bots (Slack, Feishu, DingTalk)
    "linc",
    "markdown>=3.10.3",
    "firecrawl-py<2",
    "readability-lxml>=0.8.4.1",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
# macOS-only: pywebview needs the Cocoa bridge to create native windows
macos = [
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit; sys_platform == 'darwin'",
]

# Point the two local-first packages at the sibling checkouts one level above
# the playground repo. Editable so edits in those repos are picked up live.
[tool.uv.sources]
zig = { path = "../zig", editable = true }
chakpy = { path = "../chak-ai", editable = true }
fylepy = { path = "../fyle", editable = true }
seeka = { path = "../seeka-ai", editable = true }
linc = { path = "../linc", editable = true }

[tool.uv]
# app.py / browser viewers are run as scripts, not an installed package
package = false
