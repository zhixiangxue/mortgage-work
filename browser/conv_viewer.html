<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversation Inspector</title>
  <script src="../frontend/node_modules/markdown-it/dist/markdown-it.min.js"></script>
  <style>
    :root {
      --bg:#fff; --surface:#fff; --line:#e6e6e6; --line-2:#d0d0d0;
      --text:#111; --text-2:#4a4a4a; --text-3:#8a8a8a; --text-4:#b5b5b5;
      --system:#737373; --user:#0a0a0a; --assistant:#a16207; --assist-bg:#fefce8;
      --req:#b45309; --resp:#15803d; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; }
    body { display:grid; grid-template-columns: 260px minmax(0,1fr); }
    aside { position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--line); background:var(--surface); }
    .brand { padding:14px 18px; border-bottom:1px solid var(--line); }
    .brand-name { font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .brand-sub { margin-top:5px; color:var(--text-3); font:10px var(--mono); }
    .side-section { padding:14px 18px; border-bottom:1px solid var(--line); }
    .side-title { color:var(--text-4); font:10px var(--mono); letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px; }
    .metric { display:flex; justify-content:space-between; gap:12px; padding:4px 0; font:11px var(--mono); color:var(--text-2); }
    .metric span:first-child { color:var(--text-4); }
    .turn-nav { display:flex; flex-wrap:wrap; gap:6px; }
    .turn-nav a { color:var(--text-2); text-decoration:none; border:1px solid var(--line); padding:3px 6px; font:10px var(--mono); }
    .turn-nav a:hover { border-color:var(--text); color:var(--text); }
    main { min-width:0; }
    header { border-bottom:1px solid var(--line); background:var(--surface); }
    .top { padding:14px 28px 12px; display:flex; gap:16px; align-items:flex-start; }
    .title { flex:1; min-width:0; }
    h1 { margin:0; font-size:16px; line-height:1.35; word-break:break-word; }
    .meta { margin-top:5px; color:var(--text-3); font:11px var(--mono); word-break:break-all; }
    .actions { display:flex; gap:8px; }
    button { border:1px solid var(--line-2); background:#fff; color:var(--text-2); padding:7px 10px; font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
    button:hover { border-color:var(--text); color:var(--text); }
    .stats-wrap { border-top:1px solid var(--line); overflow:auto; }
    table { width:100%; border-collapse:collapse; font:11px var(--mono); }
    th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { color:var(--text-4); font-weight:500; text-transform:uppercase; letter-spacing:.12em; font-size:9px; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .stats-model { color:var(--text-2); font:11px var(--mono); }
    .money { color:var(--resp); font-weight:700; }
    .unknown { color:var(--text-4); }
    .content { max-width:1080px; padding:22px 28px 80px; }
    .turn { margin:0 0 24px; }
    .turn-header { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line-2); padding:10px 0; color:var(--text-3); font:11px var(--mono); }
    .turn-num { color:var(--text); font-weight:700; letter-spacing:.1em; }
    .turn-id { color:var(--text-4); }
    .msg { margin:10px 0 12px; border-left:3px solid var(--line-2); padding:0 0 0 12px; }
    .role-system { border-color:var(--system); opacity:.78; }
    .role-user { border-color:var(--user); }
    .role-assistant { border-color:var(--assistant); background:linear-gradient(90deg,var(--assist-bg),transparent 42%); }
    .tool-call-msg { border-color:var(--req); }
    .tool-result { border-color:var(--resp); }
    .head { display:flex; align-items:center; gap:8px; min-height:24px; flex-wrap:wrap; }
    .badge { color:#fff; padding:2px 6px; font:10px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .role-system-b { background:var(--system); } .role-user-b { background:var(--user); }
    .role-assistant-b { background:var(--assistant); } .role-req { background:var(--req); } .role-resp { background:var(--resp); }
    .model-tag, .tok, .ts, .subtle { color:var(--text-3); font:10px var(--mono); }
    .model-tag { border:1px solid var(--line); padding:1px 5px; color:var(--text-2); }
    .body { color:var(--text-2); font-size:13px; line-height:1.65; padding:5px 0 2px; }
    .body p { margin:0 0 9px; }
    pre, .tool-body, .reasoning-content { background:#fafafa; border:1px solid var(--line); padding:10px; overflow:auto; font:11px/1.55 var(--mono); color:var(--text-2); white-space:pre-wrap; word-break:break-word; }
    details { margin:8px 0; }
    summary { cursor:pointer; color:var(--text-2); font:11px var(--mono); }
    .tool-name { font-weight:700; color:var(--req); }
    .tool-req-echo { border:1px solid var(--line); background:#fcfcfc; margin:8px 0; }
    .tool-req-echo .echo-fn { padding:7px 10px; border-bottom:1px solid var(--line); color:var(--req); font:700 11px var(--mono); }
    .copy { margin-left:auto; padding:2px 6px; font-size:9px; }
    .empty { padding:48px; color:var(--text-4); font:12px var(--mono); }
  </style>
</head>
<body>
  <aside>
    <div class="brand"><div class="brand-name">Conv Inspector</div><div id="status" class="brand-sub">loading…</div></div>
    <div class="side-section"><div class="side-title">summary</div><div id="summary"></div></div>
    <div class="side-section"><div class="side-title">turns</div><div id="turnNav" class="turn-nav"></div></div>
    <div class="side-section"><div class="side-title">pricing</div><div id="priceNote" class="brand-sub"></div></div>
  </aside>
  <main>
    <header>
      <div class="top">
        <div class="title"><h1 id="title">Conversation</h1><div id="meta" class="meta"></div></div>
        <div class="actions"><button id="refreshBtn">Refresh</button><button id="rawBtn">Copy raw</button></div>
      </div>
      <div id="stats" class="stats-wrap"></div>
    </header>
    <div id="content" class="content"><div class="empty">Loading conversation…</div></div>
  </main>
<script>
const md = window.markdownit ? window.markdownit({html:false,linkify:true,breaks:true}) : null;
let payload = null;
let rawText = '';
let rawCounter = 0;
const rawMap = new Map();
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNum(n){ return Number(n || 0).toLocaleString(); }
function money(n){ return Number.isFinite(n) ? '$' + n.toFixed(n < 0.01 ? 4 : 2) : '—'; }
function shortId(s){ s = String(s || ''); return s.length > 12 ? s.slice(0, 8) + '…' : s; }
function stashRaw(s){ const id = String(rawCounter++); rawMap.set(id, String(s ?? '')); return id; }
function copyRaw(id){ navigator.clipboard && navigator.clipboard.writeText(rawMap.get(String(id)) || ''); }
window.copyRaw = copyRaw;
function renderContent(c){
  if (c == null) return '';
  let text = '';
  if (typeof c === 'string') text = c;
  else if (Array.isArray(c)) text = c.map(p => p && p.type === 'text' ? p.text : JSON.stringify(p, null, 2)).join('\n\n');
  else text = JSON.stringify(c, null, 2);
  return `<div class="body">${md ? md.render(text) : `<pre>${esc(text)}</pre>`}</div>`;
}
function modelUri(meta){
  const md = meta || {}, pt = md.provider_trace || {};
  const p = pt.resolved_provider || md.provider;
  const m = pt.resolved_model || md.model;
  if (p && m) return `${p}/${m}`;
  return m || p || null;
}
function usageOf(m){ return (m.metadata && m.metadata.usage) || {}; }
function renderModelAndTokens(m){
  const uri = modelUri(m.metadata || {}), u = usageOf(m), parts = [];
  if (uri) parts.push(`<span class="model-tag">${esc(uri)}</span>`);
  const pt = u.prompt_tokens || 0, ct = u.completion_tokens || 0, cr = u.cache_read_input_tokens || 0, cc = u.cache_creation_input_tokens || 0;
  if (pt || ct) parts.push(`<span class="tok">↓ ${fmtNum(pt)}</span><span class="tok">↑ ${fmtNum(ct)}</span>`);
  if (cr || cc) parts.push(`<span class="tok">cache ${fmtNum(cr + cc)}</span>`);
  return parts.join('');
}
function canonicalPriceKey(uri, prices){
  if (!uri) return null;
  if (prices.models && prices.models[uri]) return uri;
  if (prices.aliases && prices.aliases[uri]) return prices.aliases[uri];
  const model = String(uri).split('/').pop();
  if (prices.aliases && prices.aliases[model]) return prices.aliases[model];
  if (prices.models && prices.models[model]) return model;
  return null;
}
function costFor(bucket, prices){
  const key = canonicalPriceKey(bucket.uri, prices || {});
  const p = key && prices.models ? prices.models[key] : null;
  if (!p) return { known:false, cost:NaN, key:null };
  const cost = (bucket.prompt * (p.input || 0) + bucket.completion * (p.output || 0) + bucket.cache_w * (p.cache_write ?? p.input ?? 0) + bucket.cache_r * (p.cache_read ?? p.input ?? 0)) / 1000000;
  return { known:true, cost, key };
}
function aggregate(messages){
  const by = new Map();
  for (const m of messages) {
    if (m.role !== 'assistant') continue;
    const u = usageOf(m); if (!u || !Object.keys(u).length) continue;
    const uri = modelUri(m.metadata || {}) || 'unknown';
    const b = by.get(uri) || { uri, calls:0, prompt:0, completion:0, cache_w:0, cache_r:0, total:0 };
    const pt = u.prompt_tokens || 0, ct = u.completion_tokens || 0, cc = u.cache_creation_input_tokens || 0, cr = u.cache_read_input_tokens || 0;
    b.calls++; b.prompt += pt; b.completion += ct; b.cache_w += cc; b.cache_r += cr; b.total += u.total_tokens || pt + ct + cc + cr;
    by.set(uri, b);
  }
  return [...by.values()].sort((a,b) => b.total - a.total);
}
function renderStats(messages, prices){
  const rows = aggregate(messages);
  if (!rows.length) { $('stats').innerHTML = '<div class="empty">no llm usage metadata</div>'; return; }
  let total = 0, knownAll = true;
  const body = rows.map(b => {
    const c = costFor(b, prices); if (c.known) total += c.cost; else knownAll = false;
    return `<tr><td><span class="stats-model">${esc(b.uri)}</span>${c.key && c.key !== b.uri ? ` <span class="unknown">priced as ${esc(c.key)}</span>` : ''}</td><td class="num">${fmtNum(b.calls)}</td><td class="num">${fmtNum(b.prompt)}</td><td class="num">${fmtNum(b.completion)}</td><td class="num">${fmtNum(b.cache_w)}</td><td class="num">${fmtNum(b.cache_r)}</td><td class="num">${fmtNum(b.total)}</td><td class="num money ${c.known ? '' : 'unknown'}">${c.known ? money(c.cost) : 'unknown'}</td></tr>`;
  }).join('');
  const totalRow = `<tr><td>total</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="num money">${knownAll ? money(total) : money(total) + ' + unknown'}</td></tr>`;
  $('stats').innerHTML = `<table><thead><tr><th>model_uri</th><th class="num">calls</th><th class="num">in</th><th class="num">out</th><th class="num">cache_w</th><th class="num">cache_r</th><th class="num">total</th><th class="num">cost</th></tr></thead><tbody>${body}${totalRow}</tbody></table>`;
}
let toolCallIndex = new Map();
function buildToolIndex(messages){
  toolCallIndex = new Map();
  for (const m of messages) if (m.role === 'assistant' && Array.isArray(m.tool_calls)) for (const tc of m.tool_calls) {
    const fn = tc.function || {};
    if (tc.id) toolCallIndex.set(tc.id, { name: fn.name || tc.name || '?', arguments: fn.arguments || tc.arguments || '' });
  }
}
function renderToolCalls(calls){
  return (calls || []).map(tc => {
    const fn = tc.function || {}, name = fn.name || tc.name || '?';
    let args = fn.arguments || tc.arguments || '';
    try { args = JSON.stringify(JSON.parse(args), null, 2); } catch {}
    return `<details open><summary><span class="tool-name">${esc(name)}</span> <span class="subtle">${esc(shortId(tc.id))}</span></summary><pre>${esc(args)}</pre></details>`;
  }).join('');
}
function renderMessage(m){
  const role = m.role || 'unknown', hasTool = Array.isArray(m.tool_calls) && m.tool_calls.length;
  const rawId = stashRaw(JSON.stringify(m, null, 2));
  if (role === 'assistant' && hasTool) {
    const names = m.tool_calls.map(tc => (tc.function && tc.function.name) || tc.name || '?').join(', ');
    return `<div class="msg tool-call-msg"><div class="head"><span class="badge role-req">tool call request</span>${renderModelAndTokens(m)}<span class="subtle">→ ${esc(names)}</span><button class="copy" onclick="copyRaw('${rawId}')">raw</button></div>${renderContent(m.content)}${renderToolCalls(m.tool_calls)}</div>`;
  }
  if (role === 'tool') {
    const req = toolCallIndex.get(m.tool_call_id); let echo = '';
    if (req) { let args = req.arguments; try { args = JSON.stringify(JSON.parse(args), null, 2); } catch {} echo = `<div class="tool-req-echo"><div class="echo-fn">${esc(req.name)}</div><pre>${esc(args)}</pre></div>`; }
    const body = typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 2);
    return `<div class="msg tool-result"><div class="head"><span class="badge role-resp">tool call response</span><span class="subtle">${esc(shortId(m.tool_call_id))}</span><button class="copy" onclick="copyRaw('${rawId}')">raw</button></div>${echo}<div class="tool-body">${esc(body || '')}</div></div>`;
  }
  const cls = role === 'system' ? 'role-system' : role === 'user' ? 'role-user' : role === 'assistant' ? 'role-assistant' : '';
  const bcls = role === 'system' ? 'role-system-b' : role === 'user' ? 'role-user-b' : role === 'assistant' ? 'role-assistant-b' : 'role-system-b';
  return `<div class="msg ${cls}"><div class="head"><span class="badge ${bcls}">${esc(role)}</span>${role === 'assistant' ? renderModelAndTokens(m) : ''}<button class="copy" onclick="copyRaw('${rawId}')">raw</button></div>${renderContent(m.content)}</div>`;
}
function groupByTurn(messages){
  const groups = []; let cur = null;
  for (const m of messages) { const tid = m.turn_id || null; if (!cur || cur.turn_id !== tid) { cur = { turn_id:tid, messages:[] }; groups.push(cur); } cur.messages.push(m); }
  return groups;
}
function renderGroups(messages){
  const groups = groupByTurn(messages); let n = 0;
  $('turnNav').innerHTML = groups.filter(g => g.turn_id).map(() => `<a href="#turn-${++n}">${String(n).padStart(2,'0')}</a>`).join('');
  n = 0;
  $('content').innerHTML = groups.map(g => {
    const isTurn = !!g.turn_id, label = isTurn ? String(++n).padStart(2,'0') : 'setup';
    const id = isTurn ? ` id="turn-${n}"` : '';
    return `<section class="turn"><div class="turn-header"${id}><span class="turn-num">${label}</span><span>${isTurn ? 'turn' : ''}</span><span class="turn-id">${esc(shortId(g.turn_id))}</span><span>${g.messages.length} msg${g.messages.length === 1 ? '' : 's'}</span></div>${g.messages.map(renderMessage).join('')}</section>`;
  }).join('') || '<div class="empty">No messages</div>';
}
function render(data){
  payload = data; rawCounter = 0; rawMap.clear();
  rawText = data.raw || JSON.stringify(data, null, 2);
  const meta = data.meta || {}, messages = data.messages || [];
  $('title').textContent = meta.title || data.conv_id || 'Conversation';
  $('meta').textContent = `${data.path || ''} · model ${meta.model || 'unknown'}`;
  $('status').textContent = `${messages.length} messages`;
  $('priceNote').textContent = `${(data.prices && data.prices.updated) || ''} · ${(data.prices && data.prices.note) || ''}`;
  const toolCalls = messages.reduce((n,m) => n + (Array.isArray(m.tool_calls) ? m.tool_calls.length : 0), 0);
  const turns = new Set(messages.map(m => m.turn_id).filter(Boolean)).size;
  $('summary').innerHTML = `<div class="metric"><span>messages</span><b>${messages.length}</b></div><div class="metric"><span>turns</span><b>${turns}</b></div><div class="metric"><span>tool calls</span><b>${toolCalls}</b></div><div class="metric"><span>jsonl</span><b>${fmtNum(rawText.length)} chars</b></div>`;
  buildToolIndex(messages); renderStats(messages, data.prices || {}); renderGroups(messages);
}
async function load(){
  $('status').textContent = 'refreshing…';
  const data = await window.pywebview.api.load();
  if (!data || data.error) { $('content').innerHTML = `<div class="empty">${esc((data && data.error) || 'load failed')}</div>`; $('status').textContent = 'error'; return; }
  render(data);
}
$('refreshBtn').onclick = load;
$('rawBtn').onclick = () => navigator.clipboard && navigator.clipboard.writeText(rawText || '');
window.addEventListener('pywebviewready', load);
if (window.pywebview) load();
</script>
</body>
</html>
