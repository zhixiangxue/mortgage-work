# The auth service is its own deployment unit — deliberately NOT part of the
# root project's dependency tree. The root pyproject pins desktop-only libs
# (zig / chakpy / fylepy / seeka / linc) to editable sibling checkouts via
# [tool.uv.sources]; those checkouts exist on dev machines but not on the
# server, so syncing them there fails with "Distribution not found".
# This file keeps the server's footprint to exactly what main.py imports.
#
# On the box, serve.sh runs `uv sync` right here (its own .venv, its own
# uv.lock). Locally, `uv run python server/main.py` from the repo root still
# works — it just uses the desktop venv, which has everything anyway.

[project]
name = "mortgage-auth"
version = "0.1.0"
description = "Mortgage Work auth service — identity, repo provisioning, session issuing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    # mailer.py (code delivery) and provision.py (Codeup/Gitee API calls)
    "httpx>=0.27",
    "pydantic>=2.10",
    # Deterministic user id — must stay in lockstep with user.py on the client
    "xxhash>=3.8.1",
]

[tool.uv]
# main.py is run as a script, not an installed package
package = false
